<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žížaly – 2 hráči</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #game {
      background: #000;
      box-shadow: 0 0 20px #000;
      border: 2px solid #333;
    }
    #info {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="info">
    Hráč 1: šipky &nbsp;|&nbsp;
    Hráč 2: W A S D &nbsp;|&nbsp;
    R = restart
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const grid = 20;
    const cols = canvas.width / grid;
    const rows = canvas.height / grid;

    const FOOD_COUNT = 10;  // málo jídla → růst opravdu pomalu

    function createWorm(x, y, color, dir) {
      return {
        body: [{ x, y }],   // začíná jen 1 čtverečkem
        dir: dir,
        pendingDir: dir,
        color: color
      };
    }

    let worms;
    let foods;
    let gameOver = false;

    function resetGame() {
      worms = [
        // hráč 1 vlevo, jde doprava
        createWorm(5, 5, '#4caf50', { x: 1, y: 0 }),
        // hráč 2 vpravo dole, jde doleva
        createWorm(cols - 6, rows - 6, '#ff9800', { x: -1, y: 0 })
      ];
      foods = [];
      spawnInitialFood();
      gameOver = false;
    }

    function randomFreeCell() {
      while (true) {
        const x = Math.floor(Math.random() * cols);
        const y = Math.floor(Math.random() * rows);

        // nesmí být na žížale
        let occupied = false;
        for (const w of worms) {
          for (const p of w.body) {
            if (p.x === x && p.y === y) {
              occupied = true;
              break;
            }
          }
          if (occupied) break;
        }
        if (occupied) continue;

        // nesmí být na jiném jídle
        for (const f of foods) {
          if (f.x === x && f.y === y) {
            occupied = true;
            break;
          }
        }
        if (occupied) continue;

        return { x, y };
      }
    }

    function spawnInitialFood() {
      while (foods.length < FOOD_COUNT) {
        foods.push(randomFreeCell());
      }
    }

    function spawnOneFood() {
      if (foods.length < FOOD_COUNT) {
        foods.push(randomFreeCell());
      }
    }

    resetGame();

    // ovládání
    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      const w1 = worms[0];
      const w2 = worms[1];

      switch (key) {
        // hráč 1 – šipky
        case 'arrowup':
          if (w1.dir.y !== 1) w1.pendingDir = { x: 0, y: -1 };
          break;
        case 'arrowdown':
          if (w1.dir.y !== -1) w1.pendingDir = { x: 0, y: 1 };
          break;
        case 'arrowleft':
          if (w1.dir.x !== 1) w1.pendingDir = { x: -1, y: 0 };
          break;
        case 'arrowright':
          if (w1.dir.x !== -1) w1.pendingDir = { x: 1, y: 0 };
          break;

        // hráč 2 – WASD
        case 'w':
          if (w2.dir.y !== 1) w2.pendingDir = { x: 0, y: -1 };
          break;
        case 's':
          if (w2.dir.y !== -1) w2.pendingDir = { x: 0, y: 1 };
          break;
        case 'a':
          if (w2.dir.x !== 1) w2.pendingDir = { x: -1, y: 0 };
          break;
        case 'd':
          if (w2.dir.x !== -1) w2.pendingDir = { x: 1, y: 0 };
          break;

        // restart
        case 'r':
          resetGame();
          break;
      }
    });

    function moveWorm(w) {
      w.dir = w.pendingDir;

      const head = w.body[0];
      let nx = head.x + w.dir.x;
      let ny = head.y + w.dir.y;

      // warp přes okraj
      if (nx < 0) nx = cols - 1;
      if (nx >= cols) nx = 0;
      if (ny < 0) ny = rows - 1;
      if (ny >= rows) ny = 0;

      // zjistit, jestli sežere jídlo
      let ateFood = false;
      for (let i = 0; i < foods.length; i++) {
        if (foods[i].x === nx && foods[i].y === ny) {
          ateFood = true;
          foods.splice(i, 1);  // jídlo zmizí
          spawnOneFood();      // spawn nové jinde
          break;
        }
      }

      // nová hlava
      w.body.unshift({ x: nx, y: ny });

      // pokud nesnědl jídlo, tak se neposune délka (stačí pop)
      if (!ateFood) {
        w.body.pop();
      }
      // pokud jídlo snědl → nepopujeme → žížala vyroste o 1
    }

    function hitSelfOrOther(w, others) {
      const head = w.body[0];

      // náraz do sebe
      for (let i = 1; i < w.body.length; i++) {
        const p = w.body[i];
        if (p.x === head.x && p.y === head.y) return true;
      }

      // náraz do druhé žížaly
      for (const o of others) {
        for (const p of o.body) {
          if (p.x === head.x && p.y === head.y) return true;
        }
      }

      return false;
    }

    function drawWorm(w) {
      ctx.fillStyle = w.color;
      for (const p of w.body) {
        ctx.fillRect(p.x * grid + 1, p.y * grid + 1, grid - 2, grid - 2);
      }
    }

    function drawFood() {
      ctx.fillStyle = '#f44336';
      for (const f of foods) {
        ctx.fillRect(f.x * grid + 4, f.y * grid + 4, grid - 8, grid - 8);
      }
    }

    function tick() {
      if (!gameOver) {
        moveWorm(worms[0]);
        moveWorm(worms[1]);

        const p1Dead = hitSelfOrOther(worms[0], [worms[1]]);
        const p2Dead = hitSelfOrOther(worms[1], [worms[0]]);

        if (p1Dead || p2Dead) {
          gameOver = true;
        }
      }

      // pozadí
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // jemná mřížka
      ctx.strokeStyle = '#151515';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // jídlo + žížaly
      drawFood();
      drawWorm(worms[0]);
      drawWorm(worms[1]);

      if (gameOver) {
        ctx.fillStyle = '#fff';
        ctx.font = '24px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Konec hry – stiskni R pro restart', canvas.width / 2, canvas.height / 2);
      }
    }

    // rychlost hry
    setInterval(tick, 100);
  </script>
</body>
</html>
